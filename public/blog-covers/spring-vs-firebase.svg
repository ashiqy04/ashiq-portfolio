<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="72%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#F2A93B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#182238" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0B1220"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- terminal prompt -->
  <text x="90" y="120" font-family="IBM Plex Mono, monospace" font-size="20" fill="#5FBE8C">$</text>
  <text x="115" y="120" font-family="IBM Plex Mono, monospace" font-size="20" fill="#8C97AC">choose --backend</text>

  <!-- branch graphic -->
  <g stroke-linecap="round" fill="none">
    <!-- trunk -->
    <path d="M 150 220 L 150 300" stroke="#232F44" stroke-width="3"/>

    <!-- dimmed branch: self-hosted -->
    <path d="M 150 300 C 150 360, 260 360, 260 420" stroke="#3A455C" stroke-width="3"/>
    <circle cx="260" cy="420" r="7" fill="#0B1220" stroke="#5C6679" stroke-width="3"/>

    <!-- amber branch: managed -->
    <path d="M 150 300 C 150 420, 420 420, 420 500" stroke="#F2A93B" stroke-width="3"/>
    <circle cx="420" cy="500" r="9" fill="#F2A93B"/>
  </g>
  <circle cx="150" cy="300" r="7" fill="#0B1220" stroke="#8C97AC" stroke-width="3"/>

  <text x="285" y="450" font-family="IBM Plex Mono, monospace" font-size="16" fill="#5C6679">self-hosted</text>
  <text x="445" y="530" font-family="IBM Plex Mono, monospace" font-size="16" fill="#F2A93B">managed</text>

  <!-- headline -->
  <text x="90" y="220" font-family="Inter, sans-serif" font-weight="700" font-size="44" fill="#E8EAF0">
    Choosing the Right-Sized
  </text>
  <text x="90" y="270" font-family="Inter, sans-serif" font-weight="700" font-size="44" fill="#E8EAF0">
    Backend
  </text>

  <!-- byline -->
  <text x="90" y="580" font-family="IBM Plex Mono, monospace" font-size="15" fill="#8C97AC">ashiq — full-stack engineer</text>
</svg>
